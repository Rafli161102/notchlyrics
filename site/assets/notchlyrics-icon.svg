<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NotchLyrics Icon">
  <defs>
    <linearGradient id="goldSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6DA84"/>
      <stop offset="100%" stop-color="#D99B26"/>
    </linearGradient>
    <linearGradient id="eqGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6DA84"/>
      <stop offset="100%" stop-color="#C88A1E"/>
    </linearGradient>
    <radialGradient id="beadGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2C6" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F4D06F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F4D06F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pure OLED Black Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#000000" stroke="#26262C" stroke-width="4"/>

  <!-- Golden Ratio Notch Pill -->
  <rect x="92" y="96" width="328" height="122" rx="36" fill="#0C0C0F" stroke="#2C2C33" stroke-width="3"/>

  <!-- Subtle Top Notch Camera / Bezel Accent -->
  <circle cx="256" cy="116" r="5" fill="#232329"/>

  <!-- Primary Karaoke Lyric Sweep Track -->
  <rect x="132" y="146" width="248" height="18" rx="9" fill="#24242A"/>
  <rect x="132" y="146" width="164" height="18" rx="9" fill="url(#goldSweep)"/>
  <circle cx="296" cy="155" r="18" fill="url(#beadGlow)"/>
  <circle cx="296" cy="155" r="7" fill="#FFF3CA"/>

  <!-- Backing Vocal / Harmony Line -->
  <rect x="176" y="180" width="160" height="10" rx="5" fill="#52525B"/>
  <rect x="176" y="180" width="96" height="10" rx="5" fill="#B88323"/>

  <!-- Live Vocal Equalizer / Audio Waveform (Centered 5-Bar Symmetry) -->
  <g>
    <rect x="148" y="316" width="24" height="58" rx="12" fill="#3D3219"/>
    <rect x="196" y="286" width="24" height="118" rx="12" fill="url(#eqGold)"/>
    <rect x="244" y="262" width="24" height="166" rx="12" fill="url(#eqGold)"/>
    <rect x="292" y="286" width="24" height="118" rx="12" fill="url(#eqGold)"/>
    <rect x="340" y="316" width="24" height="58" rx="12" fill="#3D3219"/>
  </g>
</svg>
