<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NotchLyrics</title>
  <link rel="stylesheet" href="notch.css">
</head>
<body>
  <main>
    <section id="notch" class="notch style-attached" aria-label="NotchLyrics" tabindex="0">
      <div class="upper-stage">
        <img id="artwork" class="artwork" alt="" width="56" height="56">
        <div class="lyrics">
          <p id="main-lyric" class="main-lyric"></p>
          <p id="backing-lyric" class="backing-lyric" hidden></p>
        </div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="lower-stage">
        <div class="metadata" aria-live="polite">
          <p id="track-title" class="track-title"></p>
          <p id="artist-album" class="artist-album"></p>
        </div>
        <span id="time-readout" class="time-readout" aria-label="Playback time">00:00 / 00:00</span>
        <div class="controls" aria-label="Playback controls">
          <button type="button" data-command="previous" aria-label="Previous track" title="Previous">&#9664;&#9664;</button>
          <button type="button" id="play-pause" data-command="togglePlayPause" aria-label="Play or pause" title="Play / Pause">&#9654;</button>
          <button type="button" data-command="next" aria-label="Next track" title="Next">&#9654;&#9654;</button>
        </div>
      </div>
      <div class="progress" aria-hidden="true">
        <span id="progress-fill"></span>
        <span id="progress-bead"></span>
      </div>
    </section>
  </main>
  <script src="notch.js"></script>
</body>
</html>
