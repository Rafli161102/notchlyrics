name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: windows/package-lock.json
      - name: Install dependencies, test & package Windows .exe targets
        run: |
          cd windows
          npm ci
          npm test
          npm run dist:win
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows-exe
          path: windows/dist/*.exe

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build Universal macOS archive
        run: ./build.sh --universal --package
      - uses: actions/upload-artifact@v6
        with:
          name: release-macos-zip
          path: .build/*.zip
          include-hidden-files: true

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip
